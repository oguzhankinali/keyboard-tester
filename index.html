<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klavye Testi & Analizi</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">
        <h1>Klavye Test Merkezi</h1>
        <p class="subtitle">Klavyenizin çalışıp çalışmadığını test etmek için tuşlara basın.</p>
        <button id="audioToggleBtn" class="audio-btn">Sesi Kapat</button>

        <div class="key-display" id="keyDisplay">
            Başlamak İçin Bir Tuşa Basın
        </div>

        <div class="info-container">
            <div class="info-box">
                <span class="label">Karakter</span>
                <span class="value" id="keyText">-</span>
            </div>
            <div class="info-box">
                <span class="label">Tuş Kodu</span>
                <span class="value" id="codeText">-</span>
            </div>
        </div>

        <div class="multi-press-container">
            <h3>Şu An Basılı Tutulan Tuşlar </h3>
            <div class="pressed-keys-list" id="pressedKeys">-</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
